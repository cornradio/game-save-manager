<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Save Manager</title>

<style>
    :root {
        --bg: #2f2f2f;
        --panel: #0e0e0e5e;
        --border: rgba(255,255,255,0.06);
        --accent: #54fa06;
        --text-main: #e6e6e6;
        --text-soft: #aaaaaa;
        --radius: 10px;
        --blur: 20px;
    }

    body {
        margin: 0;
        padding: 2.4em;
        background: var(--bg);
        color: var(--text-main);
        font-family: "Segoe UI", Inter, sans-serif;
        backdrop-filter: blur(10px);
    }

    h1 {
        margin: 0 0 1em 0;
        font-size: 2rem;
        font-weight: 600;
        color: #fff;
    }

    /* 顶部按钮 */
    .header-actions button {
        padding: 8px 16px;
        background: #141414;
        border: 1px solid var(--border);
        color: var(--text-main);
        border-radius: var(--radius);
        cursor: pointer;
        transition: 0.25s ease;
    }
    .header-actions button:hover {
        border-color: var(--accent);
        color: var(--accent);
    }

    #game-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    /* 卡片：更高级的暗黑玻璃面板 */
    .game-item {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.4em;
        margin-bottom: 1.2em;
        backdrop-filter: blur(var(--blur));
        transition: 0.25s;
    }
    .game-item:hover {
        border-color: var(--accent);
    }

    .game-item h2 {
        margin: 0 0 0.6em 0;
        font-size: 1.2rem;
        font-weight: 600;
        color: #fff;
    }

    .game-item p {
        margin: 0.4em 0;
        font-family: monospace;
        background: #111;
        padding: 0.5em;
        border-radius: 6px;
        border: 1px solid #1a1a1a;
        color: var(--text-soft);
    }

    /* 按钮：Minimal + 干净 */
    .actions button {
        margin-top: 8px;
        margin-right: 10px;
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #151515;
        color: var(--text-main);
        cursor: pointer;
        transition: 0.2s ease;
    }

    .actions button:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: #151515;
    }

    /* 日志：专业黑框终端风，不霓虹 */
    #log-container {
        position: fixed;
        /* top: 80vh; */
        width: 100%;
        height: 18vh;
        overflow-y: auto;
        margin: auto;
        font-family: monospace;
        white-space: pre-wrap;
        color: var(--text-soft);
    }
    .game-info{
       float:right;
       position: relative;
       top: -36px;
       font-size: small;
    }

    .log-success { color: #52ffab; }
    .log-error { color: #ff6b6b; }
    .log-info { color: var(--accent); }
</style>
</head>

<body>

<div class="header-actions" style="float:right;">
    <button onclick="testlog()" style="background-color: transparent; border: none;">.</button>
    <button onclick="openBackupsFolder()">查看备份</button>
</div>

<h1>Game Save Manager</h1>

<ul id="game-list"></ul>
<div id="log-container"></div>

<script>
function testlog(){
    log('This is a test log message.', 'info');
    log('This is a success message.', 'success');
    log('This is an error message.', 'error');
}
const logContainer = document.getElementById('log-container');

function log(message, type = 'info') {
    const timestamp = new Date().toLocaleTimeString();
    const el = document.createElement('div');
    el.className = 'log-' + type;
    el.textContent = `[${timestamp}] ${message}`;
    logContainer.appendChild(el);
    logContainer.scrollTop = logContainer.scrollHeight;
}

async function openBackupsFolder() {
    log('Opening backups folder...');
    try {
        const r = await fetch('/api/open-backups-folder', {method:'POST'});
        if (!r.ok) throw new Error('Server error');
        log('Backups folder opened.', 'success');
    } catch(e) {
        log(e.message, 'error');
    }
}

async function openFolder(gameName) {
    log(`Opening folder for '${gameName}'...`);
    try {
        const r = await fetch('/api/open-folder',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({game:gameName})
        });
        if (!r.ok) throw new Error('Server error');
        log(`Folder opened: ${gameName}`, 'success');
    } catch(e){
        log(e.message, 'error');
    }
}

async function performAction(gameName, direction) {
    log(`${direction} - ${gameName}`);
    try {
        const r = await fetch('/api/sync',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({game:gameName, direction})
        });
        const result = await r.json();
        if (!r.ok) throw new Error(result.message);
        log(result.message,'success');
        fetchGames();
    } catch(e){
        log(e.message,'error');
    }
}

async function fetchGames() {
    try {
        const r = await fetch('/api/games');
        if (!r.ok) throw new Error('Fetch error');
        const games = await r.json();

        const list = document.getElementById('game-list');
        list.innerHTML = '';

        for (const g of games) {
            const item = document.createElement('li');
            item.className = 'game-item';
            item.innerHTML = `
                <h2>${g.name}</h2>
                <div class="game-info">备份: <span class="backup-count">...</span></div>
                <p><strong>Local:</strong> ${g.localPath}</p>
                <p><strong>Remote:</strong> ${g.remoteFullPath || 'Not set'}</p>
                <div class="actions">
                    <button onclick="performAction('${g.name}','push')">本地 → 远程</button>
                    <button onclick="performAction('${g.name}','pull')">远程 → 本地</button>
                    <button onclick="performAction('${g.name}','backupLocal')">仅备份本地</button>
                </div>
            `;
            list.appendChild(item);

            fetch(`/api/backups/${encodeURIComponent(g.name)}`)
                .then(r=>r.json())
                .then(d=>{ item.querySelector('.backup-count').textContent = d.count; })
                .catch(()=>{ item.querySelector('.backup-count').textContent = 'Error'; });
        }

    } catch(e){
        log(e.message,'error');
    }
}

log('Interface loaded.');
fetchGames();
</script>

</body>
</html>
